[project]
name = "universal-mcp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.1",
    "qrcode[pil]>=8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
